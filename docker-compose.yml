version: '3.8'

services:
  # Backend Express Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: freightledger-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres.bcnjraeeovjhlckveewl:Rishabh%401221%23@aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres}
      - JWT_SECRET=${JWT_SECRET:-4f8b92d6e1a3c750b2e8d91f4a6c8e3d0f2a7b9c1e5d8a4f6b0c2d7e9a1b3c5f}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - AWS_REGION=${AWS_REGION:-ap-southeast-2}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME:-fundsroom-avatars-app}
    networks:
      - app-network
 
  # Frontend Nginx React Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: freightledger-frontend
    restart: always
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=/api
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
